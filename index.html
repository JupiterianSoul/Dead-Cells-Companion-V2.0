<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Cells Item Database</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Dead Cells Item Database</h1>
            <p>Complete item collection with stats and details</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <input type="text" id="searchInput" placeholder="Search items...">
                
                <select id="categorySelect">
                    <option value="all">All Categories</option>
                </select>
                
                <select id="sortSelect">
                    <option value="name">Sort by Name</option>
                    <option value="dps">Sort by DPS</option>
                    <option value="price">Sort by Price</option>
                </select>
                
                <button id="sortOrderBtn" title="Toggle sort order">⇅</button>
                <button id="randomBtn" title="Random item">🎲</button>
                <button id="exportJsonBtn" title="Export JSON">📥 JSON</button>
                <button id="exportCsvBtn" title="Export CSV">📥 CSV</button>
                <button id="reloadBtn" title="Reload data">↻</button>
            </div>
            
            <div class="stats" id="stats"></div>
        </div>

        <!-- Compare Bar -->
        <div id="compareBar" class="compare-bar" style="display: none;">
            <div class="compare-header">
                <h3>Compare Items (<span id="compareCount">0</span>/3)</h3>
                <button id="clearCompareBtn">Clear All</button>
            </div>
            <div id="compareItems" class="compare-items"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Item List -->
            <div class="item-list">
                <div id="itemsContainer"></div>
                
                <!-- Pagination -->
                <div class="pagination">
                    <button id="prevBtn">← Previous</button>
                    <span id="pageInfo"></span>
                    <button id="nextBtn">Next →</button>
                </div>
            </div>

            <!-- Detail Panel -->
            <div class="detail-panel">
                <div id="detailContent" class="detail-empty">
                    <p>Select an item to view details</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
